version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smart_leads_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smart_leads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_leads_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart_leads
      - JWT_SECRET=production_super_secret_jwt_key_2026
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_leads_frontend
    restart: always
    ports:
      - '3000:80' # Expose Nginx port 80 to host port 3000
    depends_on:
      - backend

volumes:
  mongodb_data:
    driver: local
